<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1132" width="100%" height="1132" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">What a terminal is: a text window that types one line and prints back what happened</title>
  <desc id="term-desc">On the left is a drawing of a terminal window — a dark rounded panel with three small dots along its top edge, headed "the shape of it". Inside it are three kinds of line. First a prompt, written as a folder name followed by a dollar sign, with the command "ls" typed after it. Beneath that the output of the command: a short folder listing reading AGENTS.md, README.md, docs and stack. Then the same prompt again with the command "ls stack", and beneath it a second listing reading 01-company, CONTEXT.md and INDEX.md. The last line is the prompt on its own with a solid block after it, which is the cursor waiting for you. A note under the window explains that the prompt waits for you, the command goes after it, and what came back is printed underneath in order — a blinking block means it is waiting, scrolling text means it is working. On the right, four numbered cards answer the four questions a beginner has. One, what a command is: one line, one job, and nothing happens until you press enter. Two, what the output is: it tells you what happened, in order, under the line that caused it. Three, why it looks so bare: there are no buttons because it is a receipt printer, and that is exactly the property you want when something is changing your files. Four, who types them: the AI does, and you read the line it proposes and approve or refuse it. Across the bottom, two cards mark the things worth a second look before you approve — anything that deletes, meaning removing or overwriting a file, where you should ask what it removes and whether you still have a copy of the folder from before you began; and any path outside your folder, because the work should stay inside the folder you scoped and a line pointing somewhere else is worth a question first. The closing line says you are not learning to type commands, you are learning to read one before you say yes.</desc>

  <rect x="0" y="0" width="1200" height="1132" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">What the terminal actually is</text>
  <text x="48" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A text window. One line goes in, and what happened prints back underneath.</text>

