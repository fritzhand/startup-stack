  <text x="600" y="1226" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-text, #10222C)">Git is the history; GitHub is the copy of it that lives somewhere else.</text>
