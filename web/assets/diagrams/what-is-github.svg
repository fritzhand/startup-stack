<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1312" width="100%" height="1312" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="github-title github-desc">
  <title id="github-title">Git and GitHub are not the same thing</title>
  <desc id="github-desc">Two columns stand side by side, showing the same history kept in two places. The left column is headed Git, labelled "on your computer", and described as the history of your folder. It contains a drawing of a laptop: a screen with a base bar beneath it, and inside the screen a folder called company, the caption "every saved version, in order", and a vertical line threaded through three dots. The dots are labelled, from newest to oldest, "now", "the change before that" and "where you started". Three notes under the laptop say that Git works with no internet, needs no account and no sign-up, and that nothing leaves your machine. The right column is headed GitHub, labelled "online, in your account", and described as a copy of that history kept online. It contains a drawing of a window with a title bar reading "your account / company", and inside it the caption "the same history, copied here" above the identical vertical line and three identically labelled dots, because it is the same history rather than a different one. There is no laptop base under this window, because it is not your machine. Three notes under it say that GitHub needs an account and internet, that it is kept on someone else's computer, and that you choose who can see it. Between the two columns run two arrows, one each way. The upper arrow points from Git to GitHub and is labelled "push", meaning send your history up. The lower arrow points from GitHub back to Git and is labelled "clone or pull", meaning bring the copy down. A short connector drops from the GitHub column into a row of three cards headed "what the online copy gets you", each marked with a tick. The first, "survives a lost laptop", says the folder and its history are already elsewhere, so you take a copy down and carry on. The second, "let one person in", says a coach or co-founder can be given access to the copy, so you stop emailing files about. The third, "it can publish a page", says a repository can serve a page on the web, the same files read as a site instead. Below them sits a warning card outlined in red, headed "check which one you made", which states that a private repository is private and a public one is public, and that because a knowledge base holds customer names, prices and contracts, you should check which kind you made before you push. The closing line reads: Git is the history; GitHub is the copy of it that lives somewhere else.</desc>

  <rect x="0" y="0" width="1200" height="1312" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">Git and GitHub are not the same thing</text>
  <text x="48" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">One is the history on your computer. The other is a copy of it that lives online.</text>

  <text x="48" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Where each one lives</text>
  <text x="48" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">The same history in two places, and the two moves that connect them.</text>
  <line x1="48" y1="186" x2="1152" y2="186" stroke="var(--dg-border-strong, #75878F)" stroke-width="1.5"/>

