  <circle cx="804" cy="350" r="5" fill="var(--dg-border, #C1D1D8)"/>
  <text x="826" y="355" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">your account / company</text>
  <line x1="744" y1="370" x2="1124" y2="370" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <text x="768" y="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">the same history, copied here</text>

