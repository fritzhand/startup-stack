  <circle cx="780" cy="420" r="6" fill="var(--dg-primary, #0B5A86)"/>
  <circle cx="780" cy="455" r="6" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <circle cx="780" cy="490" r="6" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <text x="802" y="426" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-text, #10222C)">now</text>
  <text x="802" y="461" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">the change before that</text>
  <text x="802" y="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">where you started</text>

  <circle cx="752" cy="570" r="4" fill="var(--dg-primary, #0B5A86)"/>
  <text x="768" y="575" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Needs an account and internet.</text>
