  <line x1="934" y1="664" x2="934" y2="688" stroke="var(--dg-border-strong, #75878F)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="927,681 934,690 941,681" fill="none" stroke="var(--dg-border-strong, #75878F)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

