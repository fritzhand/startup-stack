  <line x1="692" y1="510" x2="502" y2="510" stroke="var(--dg-primary, #0B5A86)" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="510,503 500,510 510,517" fill="none" stroke="var(--dg-primary, #0B5A86)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="536" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">bring the copy down</text>

