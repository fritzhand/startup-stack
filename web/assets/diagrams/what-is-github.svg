  <text x="452" y="882" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Let one person in</text>
  <text x="452" y="910" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A coach or co-founder can be<tspan x="452" dy="26">given access to the copy, so</tspan><tspan x="452" dy="26">you stop emailing files about.</tspan></text>

  <rect x="800" y="798" width="352" height="196" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <polyline points="828,838 836,846 852,830" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="828" y="882" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">It can publish a page</text>
  <text x="828" y="910" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A repository can serve a page<tspan x="828" dy="26">on the web — the same files,</tspan><tspan x="828" dy="26">read as a site instead.</tspan></text>

  <!-- the warning -->
  <rect x="48" y="1026" width="1104" height="124" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-accent, #C62C49)" stroke-width="2"/>
  <circle cx="96" cy="1062" r="18" fill="none" stroke="var(--dg-accent, #C62C49)" stroke-width="2"/>
  <line x1="96" y1="1052" x2="96" y2="1064" stroke="var(--dg-accent, #C62C49)" stroke-width="2.5" stroke-linecap="round"/>
