  <text x="768" y="639" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">You choose who can see it.</text>

  <!-- the two moves between them -->
  <text x="600" y="396" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-primary, #0B5A86)">push</text>
