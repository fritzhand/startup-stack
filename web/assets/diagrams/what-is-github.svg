  <path d="M 100 366 V 350 H 110 L 114 355 H 124 V 366 Z" fill="none" stroke="var(--dg-primary, #0B5A86)" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="136" y="366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-text, #10222C)">company</text>
  <text x="100" y="392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">every saved version, in order</text>

