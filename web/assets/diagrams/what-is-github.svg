  <circle cx="112" cy="420" r="6" fill="var(--dg-primary, #0B5A86)"/>
  <circle cx="112" cy="455" r="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <circle cx="112" cy="490" r="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <text x="134" y="426" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-text, #10222C)">now</text>
  <text x="134" y="461" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">the change before that</text>
  <text x="134" y="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">where you started</text>

  <rect x="60" y="530" width="412" height="10" rx="5" fill="var(--dg-border-strong, #75878F)"/>

  <circle cx="84" cy="570" r="4" fill="var(--dg-primary, #0B5A86)"/>
  <text x="100" y="575" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Works with no internet.</text>
  <circle cx="84" cy="602" r="4" fill="var(--dg-primary, #0B5A86)"/>
  <text x="100" y="607" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">No account, no sign-up.</text>
  <circle cx="84" cy="634" r="4" fill="var(--dg-primary, #0B5A86)"/>
  <text x="100" y="639" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Nothing leaves your machine.</text>

  <!-- right column: github -->
  <rect x="716" y="210" width="436" height="454" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <text x="744" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="var(--dg-primary, #0B5A86)">Online, in your account</text>
  <text x="744" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">GitHub</text>
  <text x="744" y="306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A copy of that history, kept online.</text>

  <rect x="744" y="326" width="380" height="196" rx="12" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border-strong, #75878F)" stroke-width="2"/>
