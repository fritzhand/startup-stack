<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1264" width="100%" height="1264" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="editor-title editor-desc">
  <title id="editor-title">What an editor is, and the four capabilities that make one agentic</title>
  <desc id="editor-desc">A stylised editor window sits at the top, drawn as a rounded frame with three small dots along its title bar and the label "company — context.md". Inside it are three panes. The left pane, labelled "file tree", shows a folder called company holding four files: context.md, notes.md, quotes.pdf and numbers.csv. The row for context.md is highlighted, marking it as the file currently open. The centre pane, labelled "file contents", shows that same file: its name at the top, and beneath it six grey bars of varying length standing in for two short paragraphs of ordinary prose, ragged at the right-hand edge because this is writing rather than code. The right pane, labelled "chat panel", shows a short instruction from you, "Read context.md and list what is missing", then what the tool proposes to do about it, "Edit context.md, add a gaps section", and under that a pair of buttons marked Approve, with a tick, and Reject, with a cross. Three captions beneath the window say what each pane is for. The left pane is every file in the folder listed in one place, with the file being shown marked, and you never paste any of it in. The centre pane is what is actually in the file you opened, usually ordinary prose such as notes, a plan or a draft, and rarely code. The right pane is where you give the instruction and where you approve or refuse what it proposes, before anything happens. Below the window, a row of four numbered cards sets out the capabilities that separate an agentic editor from a chat window with an upload button, which has only the first of them. One, it reads: it opens every file in the folder itself, so you paste nothing in. Two, it writes: it creates and edits files back in the folder, not just in a reply. Three, it runs: it runs commands and shows you the output, so you can see what happened. Four, it explains: it tells you what changed, file by file, before you decide to keep it. The closing line says that if a tool does all four it will run this method, and that if it only does the first you will spend your evenings copying text back and forth.</desc>

